version: 2

# Processus de mise à jour des dépendances — Bot Discord (C4.1.1)
#
# Périmètre  : dépendances npm, image Docker, actions CI.
# Fréquence  : hebdomadaire le lundi.
# Mode       : automatique pour la détection, manuel pour la validation.
#
# Particularité : discord.js suit les évolutions de l'API Discord, qui déprécie
# régulièrement des endpoints avec un préavis court. Les mises à jour de cette
# bibliothèque sont donc suivies séparément et jamais regroupées, afin de
# pouvoir lire le journal de versions amont avant toute fusion.

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    target-branch: dev
    labels:
      - "type:deps"
      - "composant:bot"
    commit-message:
      prefix: "deps"
      prefix-development: "chore"
      include: scope
    groups:
      dev-tools:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels:
      - "type:deps"
      - "composant:infra"
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - "type:deps"
      - "composant:infra"
    commit-message:
      prefix: "ci"
